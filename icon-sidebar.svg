<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Magnifying glass lens (bigger) -->
  <circle cx="10" cy="10" r="9.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <!-- Cat ears (above the lens) -->
  <path d="M4.5 5.5L7 1.5L9.5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10.5 5L13 1.5L15.5 5.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner left ear -->
  <path d="M5.3 5.5L7 3L8.7 5" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Inner right ear -->
  <path d="M11.3 5L13 3L14.7 5.5" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <!-- Cat eyes -->
  <circle cx="7" cy="8.5" r="0.9" fill="currentColor"/>
  <circle cx="13" cy="8.5" r="0.9" fill="currentColor"/>
  <!-- Nose -->
  <path d="M9.5 11L10 11.5L10.5 11" stroke="currentColor" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M8.5 12.5C8.5 12.5 9.2 13.2 10 13.2C10.8 13.2 11.5 12.5 11.5 12.5" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Whiskers left -->
  <line x1="3.5" y1="11" x2="6.3" y2="11.2" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="3.5" y1="12.2" x2="6.3" y2="12" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <!-- Whiskers right -->
  <line x1="13.7" y1="11.2" x2="16.5" y2="11" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <line x1="13.7" y1="12" x2="16.5" y2="12.2" stroke="currentColor" stroke-width="0.4" stroke-linecap="round" opacity="0.5"/>
  <!-- Magnifying glass handle (short) -->
  <line x1="17" y1="17" x2="21" y2="21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
</svg>
